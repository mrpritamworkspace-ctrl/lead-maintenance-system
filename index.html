<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Maintenance Dashboard</title>
    <link rel="stylesheet" href="task2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1><i class="fa-solid fa-users-gear"></i> Lead Maintenance System</h1>
        <p>Add leads, update status, and manage categorized dashboards</p>
      </header>

      <!-- Top Section: Form + Filter Controls -->
      <div class="top-section">
        <!-- Input Form -->
        <div class="card-box form-box">
          <h2><i class="fa-solid fa-user-plus"></i> Add New Lead</h2>
          <form id="leadForm">
            <div class="form-grid">
              <div class="form-group">
                <label>Name</label>
                <input
                  id="name"
                  type="text"
                  placeholder="Enter Full Name"
                  required
                />
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input
                  id="phone"
                  type="tel"
                  placeholder="Enter Phone Number"
                  required
                />
              </div>
              <div class="form-group">
                <label>Course & Services</label>
                <select id="course_services" required>
                  <option value="" disabled selected>Select Course</option>
                  <option value="Web Development">Web Development</option>
                  <option value="Data Science">Data Science</option>
                  <option value="Digital Marketing">Digital Marketing</option>
                </select>
              </div>
              <div class="form-group">
                <label>Preferred Time</label>
                <input id="preferredTime" type="time" required />
              </div>
              <div class="form-group">
                <label for="status">Lead Status</label>
                <select id="status" required>
                  <option value="new" selected>New Lead</option>
                  <option value="contacted">Contacted Lead</option>
                </select>
              </div>
            </div>
            <button id="submit" type="submit" class="btn-primary">
              <i class="fa-solid fa-paper-plane"></i> Submit Lead
            </button>
          </form>
        </div>

        <!-- Search & Filter Controls Box -->
<div class="dashboard-card border-total">   
  <h2><i class="fa-solid fa-filter"></i> Search & Filters</h2>
          <div class="form-group">
            <label>Search by Name</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="searchName"
                placeholder="Type name to search..."
              />
            </div>
          </div>
          <div class="form-group">
            <label>Filter by Status</label>
            <select id="filterStatus">
              <option value="all">All Statuses</option>
              <option value="new">New Leads</option>
              <option value="contacted">Contacted Leads</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 3 Categorized Dashboards -->
      <div class="dashboards-grid">
        <!-- DASHBOARD 1: All Leads -->
        <div class="dashboard_card border-total">
          <div class="dash-header">
            <h3><i class="fa-solid fa-layer-group"></i> Total Leads</h3>
            <span class="count-tag">1</span>
          </div>
          <div class="lead-list" id="totalLeadsList">            
          </div>
        </div>

        <!-- DASHBOARD 2: New Leads -->
        <div class="dashboard-card border-new">
          <div class="dash-header">
            <h3><i class="fa-solid fa-user-clock"></i> New Leads</h3>
            <span class="count-tag yellow"></span>
          </div>
          <div class="lead-list" id="newLeadsList">
            
          </div>
        </div>

        <!-- DASHBOARD 3: Contacted Leads -->
        <div class="dashboard-card border-contacted">
          <div class="dash-header">
            <h3><i class="fa-solid fa-user-check"></i> Contacted Leads</h3>
            <span class="count-tag green">0</span>
          </div>
          <div class="lead-list" id="contactedLeadsList">
          </div>
        </div>
      </div>
    </div>
    <script src="task2.js"></script>
  </body>
</html>
